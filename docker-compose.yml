services:
  postgres:
      image: postgres:16
      restart: unless-stopped
      environment:
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_PASSWORD=${DB_PASSWORD}
        - POSTGRES_DB=${DB_NAME}
      volumes:
        - postgres_data:/var/lib/postgresql
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
        interval: 5s
        timeout: 5s
        retries: 5
      networks:
        - flagpulse_net
  
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - flagpulse_net

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "npm run migrate && npm run start"
    restart: unless-stopped
    networks:
      - flagpulse_net

  nginx:
    build: 
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "${PORT}:80"
    depends_on:
      - backend
    networks: 
      - flagpulse_net


networks:
  flagpulse_net:

volumes:
  postgres_data:
  redis_data: